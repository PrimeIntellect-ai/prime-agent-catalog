name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate catalogs
        run: python3 scripts/validate_catalogs.py
      - name: Check plugins catalog drift
        run: python3 scripts/generate_plugins_catalog.py --check
      - name: Run mutation validation tests
        run: python3 scripts/test_mutation_validation.py
      - name: Run PR title convention tests
        run: python3 scripts/test_check_pr_title.py

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check the PR title against the tracking conventions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_pr_title.py
